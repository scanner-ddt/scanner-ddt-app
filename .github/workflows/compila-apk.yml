name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compila:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compila l'app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Salva l'APK tra gli artefatti
        uses: actions/upload-artifact@v4
        with:
          name: ScannerDDT-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Pubblica l'APK nella release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ScannerDDT.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima ScannerDDT.apk \
            --title "Scanner DDT - ultima versione" \
            --notes "Compilata automaticamente (build ${{ github.run_number }}). Scarica ScannerDDT.apk sul telefono e installalo."
